<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patent Manager - SWE304 Project 4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
    color: #e2e8f0;
    padding: 1.5rem;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
  }
  h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }
  .subtitle { color: #94a3b8; font-size: 0.9rem; margin-top: 0.2rem; }

  .pod-chip {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(52, 211, 153, 0.4);
    border-radius: 999px;
    padding: 0.5rem 1rem;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: background 0.5s, border-color 0.5s;
  }
  .pod-chip.changed {
    background: rgba(52, 211, 153, 0.3);
    border-color: #f472b6;
  }
  .pod-dot {
    width: 8px; height: 8px;
    background: #34d399;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
    box-shadow: 0 0 8px #34d399;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .pod-chip .label { color: #94a3b8; }
  .pod-chip .value { color: #34d399; font-weight: 600; }

  .tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    padding-bottom: 0.5rem;
  }
  .tab {
    background: rgba(30, 41, 59, 0.4);
    border: 1px solid rgba(148, 163, 184, 0.15);
    padding: 0.7rem 1.4rem;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    color: #94a3b8;
    font-size: 0.95rem;
    font-weight: 500;
    transition: all 0.2s;
  }
  .tab:hover { color: #e2e8f0; }
  .tab.active {
    background: linear-gradient(180deg, #6366f1, #4f46e5);
    color: white;
    border-color: #6366f1;
  }
  .tab-count {
    display: inline-block;
    background: rgba(0,0,0,0.25);
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    margin-left: 0.4rem;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 1.5rem;
  }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: rgba(30, 41, 59, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 14px;
    padding: 1.5rem;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .card h2 {
    color: #cbd5e1;
    font-size: 1.1rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card h2 .ic {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    color: white;
  }

  label {
    display: block;
    color: #94a3b8;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.3rem;
    margin-top: 0.8rem;
  }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 0.7rem;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
  }
  button {
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    padding: 0.7rem 1.4rem;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: 600;
    margin-top: 1rem;
    transition: transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,0.4); }
  button.del {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.4);
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
    margin-top: 0;
  }
  button.del:hover { background: rgba(239, 68, 68, 0.4); color: white; }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 0.8rem 0.6rem;
    text-align: left;
    border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    font-size: 0.9rem;
  }
  th {
    color: #94a3b8;
    font-weight: 500;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  td { color: #e2e8f0; }
  td.id { font-family: monospace; color: #94a3b8; }
  td.title { color: #a78bfa; font-weight: 500; }
  td.name { color: #34d399; font-weight: 500; }

  .empty { text-align: center; color: #64748b; padding: 2rem; }

  .footer {
    margin-top: 2rem;
    color: #64748b;
    font-size: 0.8rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.4);
    border-radius: 999px;
    font-size: 0.7rem;
    margin: 0.1rem;
    color: #c7d2fe;
  }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid #34d399;
    color: #34d399;
    padding: 0.8rem 1.2rem;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { border-color: #ef4444; color: #fca5a5; }
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <div>
      <h1>Patent Manager</h1>
      <div class="subtitle">SWE304 Project 4 - LIVE DEMO BUILD2</div>
    </div>
    <div class="pod-chip" id="podChip" title="Bu istegi karsilayan Kubernetes pod">
      <span class="pod-dot"></span>
      <span class="label">pod:</span>
      <span class="value" id="podName">-</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="authors">Authors <span class="tab-count" id="cnt-authors">0</span></div>
    <div class="tab" data-tab="patents">Patents <span class="tab-count" id="cnt-patents">0</span></div>
    <div class="tab" data-tab="certifications">Certifications <span class="tab-count" id="cnt-certifications">0</span></div>
  </div>

  <!-- AUTHORS -->
  <div class="tab-content active" id="tab-authors">
    <div class="grid">
      <div class="card">
        <h2><span class="ic">+</span> Yeni Author</h2>
        <form id="formAuthor">
          <label>Name (max 16)</label>
          <input name="name" maxlength="16" required placeholder="Tesla">
          <label>Address (max 32)</label>
          <input name="address" maxlength="32" placeholder="Smiljan, Croatia">
          <button type="submit">Ekle</button>
        </form>
      </div>
      <div class="card">
        <h2><span class="ic">A</span> Authors Listesi</h2>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Address</th><th></th></tr></thead>
          <tbody id="tblAuthors"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- PATENTS -->
  <div class="tab-content" id="tab-patents">
    <div class="grid">
      <div class="card">
        <h2><span class="ic">+</span> Yeni Patent</h2>
        <form id="formPatent">
          <label>Title (max 32)</label>
          <input name="title" maxlength="32" required placeholder="AC Induction Motor">
          <label>Description (max 64)</label>
          <input name="description" maxlength="64" placeholder="Two-phase motor...">
          <button type="submit">Ekle</button>
        </form>
      </div>
      <div class="card">
        <h2><span class="ic">P</span> Patents Listesi</h2>
        <table>
          <thead><tr><th>ID</th><th>Title</th><th>Description</th><th></th></tr></thead>
          <tbody id="tblPatents"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CERTIFICATIONS -->
  <div class="tab-content" id="tab-certifications">
    <div class="grid">
      <div class="card">
        <h2><span class="ic">+</span> Yeni Certification</h2>
        <form id="formCert">
          <label>Author</label>
          <select name="authorId" id="selAuthor" required></select>
          <label>Patent</label>
          <select name="patentId" id="selPatent" required></select>
          <label>Issue Date</label>
          <input type="date" name="issueDate" required>
          <label>Duration (year)</label>
          <input type="number" name="durationYears" min="1" max="50" required value="10">
          <button type="submit">Ekle</button>
        </form>
      </div>
      <div class="card">
        <h2><span class="ic">C</span> Certifications Listesi</h2>
        <table>
          <thead>
            <tr><th>ID</th><th>Author</th><th>Patent</th><th>Issue Date</th><th>Duration</th><th></th></tr>
          </thead>
          <tbody id="tblCerts"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let lastPod = null;

  function toast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  async function fetchJSON(url, opts) {
    const res = await fetch(url, opts);
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch(e){}
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function refreshPod() {
    try {
      const info = await fetchJSON('/api/info');
      const chip = document.getElementById('podChip');
      const name = document.getElementById('podName');
      if (lastPod && lastPod !== info.pod) {
        chip.classList.remove('changed');
        void chip.offsetWidth;
        chip.classList.add('changed');
      }
      name.textContent = info.pod;
      lastPod = info.pod;
    } catch (e) {
      document.getElementById('podName').textContent = 'offline';
    }
  }

  // ---- Tabs ----
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    });
  });

  // ---- Authors ----
  async function loadAuthors() {
    const list = await fetchJSON('/api/authors');
    document.getElementById('cnt-authors').textContent = list.length;
    const tbody = document.getElementById('tblAuthors');
    tbody.innerHTML = list.length === 0
      ? '<tr><td colspan="4" class="empty">Henuz author yok</td></tr>'
      : list.map(a => `
          <tr>
            <td class="id">#${a.id}</td>
            <td class="name">${escapeHtml(a.name)}</td>
            <td>${escapeHtml(a.address || '')}</td>
            <td><button class="del" onclick="delAuthor(${a.id})">Sil</button></td>
          </tr>`).join('');
    populateAuthorSelect(list);
  }
  async function delAuthor(id) {
    if (!confirm('Author #' + id + ' silinsin mi? (Iliskili certification varsa hata alabilirsin)')) return;
    try { await fetchJSON('/api/authors/' + id, { method: 'DELETE' }); toast('Author silindi'); loadAll(); }
    catch (e) { toast('Silme hatasi: ' + e.message, true); }
  }
  document.getElementById('formAuthor').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = { name: f.name.value, address: f.address.value };
    try {
      await fetchJSON('/api/authors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      f.reset();
      toast('Author eklendi');
      loadAll();
    } catch (e) { toast('Hata: ' + e.message, true); }
  });

  // ---- Patents ----
  async function loadPatents() {
    const list = await fetchJSON('/api/patents');
    document.getElementById('cnt-patents').textContent = list.length;
    const tbody = document.getElementById('tblPatents');
    tbody.innerHTML = list.length === 0
      ? '<tr><td colspan="4" class="empty">Henuz patent yok</td></tr>'
      : list.map(p => `
          <tr>
            <td class="id">#${p.id}</td>
            <td class="title">${escapeHtml(p.title)}</td>
            <td>${escapeHtml(p.description || '')}</td>
            <td><button class="del" onclick="delPatent(${p.id})">Sil</button></td>
          </tr>`).join('');
    populatePatentSelect(list);
  }
  async function delPatent(id) {
    if (!confirm('Patent #' + id + ' silinsin mi?')) return;
    try { await fetchJSON('/api/patents/' + id, { method: 'DELETE' }); toast('Patent silindi'); loadAll(); }
    catch (e) { toast('Silme hatasi: ' + e.message, true); }
  }
  document.getElementById('formPatent').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = { title: f.title.value, description: f.description.value };
    try {
      await fetchJSON('/api/patents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      f.reset();
      toast('Patent eklendi');
      loadAll();
    } catch (e) { toast('Hata: ' + e.message, true); }
  });

  // ---- Certifications ----
  async function loadCerts() {
    const list = await fetchJSON('/api/certifications');
    document.getElementById('cnt-certifications').textContent = list.length;
    const tbody = document.getElementById('tblCerts');
    tbody.innerHTML = list.length === 0
      ? '<tr><td colspan="6" class="empty">Henuz certification yok</td></tr>'
      : list.map(c => `
          <tr>
            <td class="id">#${c.id}</td>
            <td class="name">${escapeHtml(c.author ? c.author.name : '?')}</td>
            <td class="title">${escapeHtml(c.patent ? c.patent.title : '?')}</td>
            <td>${c.issueDate || '-'}</td>
            <td>${c.durationYears || '-'} yil</td>
            <td><button class="del" onclick="delCert(${c.id})">Sil</button></td>
          </tr>`).join('');
  }
  async function delCert(id) {
    if (!confirm('Certification #' + id + ' silinsin mi?')) return;
    try { await fetchJSON('/api/certifications/' + id, { method: 'DELETE' }); toast('Certification silindi'); loadAll(); }
    catch (e) { toast('Silme hatasi: ' + e.message, true); }
  }
  document.getElementById('formCert').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = {
      authorId: parseInt(f.authorId.value),
      patentId: parseInt(f.patentId.value),
      issueDate: f.issueDate.value,
      durationYears: parseInt(f.durationYears.value)
    };
    try {
      await fetchJSON('/api/certifications', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      f.reset();
      f.durationYears.value = 10;
      toast('Certification eklendi');
      loadAll();
    } catch (e) { toast('Hata: ' + e.message, true); }
  });

  function populateAuthorSelect(list) {
    const sel = document.getElementById('selAuthor');
    sel.innerHTML = list.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (#${a.id})</option>`).join('')
      || '<option value="">Once author ekleyin</option>';
  }
  function populatePatentSelect(list) {
    const sel = document.getElementById('selPatent');
    sel.innerHTML = list.map(p => `<option value="${p.id}">${escapeHtml(p.title)} (#${p.id})</option>`).join('')
      || '<option value="">Once patent ekleyin</option>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadAll() {
    try { await Promise.all([loadAuthors(), loadPatents(), loadCerts()]); }
    catch (e) { toast('Yukleme hatasi: ' + e.message, true); }
  }

  refreshPod();
  loadAll();
  setInterval(refreshPod, 1500);
</script>
</body>
</html>
